<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="700" height="700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="700" height="700" fill="url(#bg)"/>
  <!-- body -->
  <ellipse cx="350" cy="720" rx="250" ry="150" fill="#f59e0b"/>
  <polygon points="350,590 310,640 350,670 390,640" fill="#111827"/>
  <!-- ears -->
  <polygon points="175,285 195,90 330,200" fill="#f59e0b"/>
  <polygon points="525,285 505,90 370,200" fill="#f59e0b"/>
  <polygon points="205,230 213,140 290,205" fill="#f9a8d4"/>
  <polygon points="495,230 487,140 410,205" fill="#f9a8d4"/>
  <!-- head -->
  <ellipse cx="350" cy="380" rx="195" ry="170" fill="#f59e0b"/>
  <!-- forehead stripes -->
  <g stroke="#b45309" stroke-width="12" stroke-linecap="round">
    <line x1="350" y1="225" x2="350" y2="275"/>
    <line x1="305" y1="232" x2="313" y2="272"/>
    <line x1="395" y1="232" x2="387" y2="272"/>
  </g>
  <!-- muzzle -->
  <ellipse cx="350" cy="465" rx="85" ry="55" fill="#fde68a"/>
  <!-- sunglasses -->
  <rect x="195" y="330" width="135" height="85" rx="28" fill="#0b0b0f"/>
  <rect x="370" y="330" width="135" height="85" rx="28" fill="#0b0b0f"/>
  <rect x="325" y="348" width="50" height="14" rx="7" fill="#0b0b0f"/>
  <line x1="195" y1="352" x2="160" y2="335" stroke="#0b0b0f" stroke-width="12" stroke-linecap="round"/>
  <line x1="505" y1="352" x2="540" y2="335" stroke="#0b0b0f" stroke-width="12" stroke-linecap="round"/>
  <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="9" stroke-linecap="round">
    <line x1="225" y1="355" x2="255" y2="345"/>
    <line x1="400" y1="355" x2="430" y2="345"/>
  </g>
  <!-- nose and mouth -->
  <polygon points="328,442 372,442 350,466" fill="#f472b6"/>
  <path d="M350 466 L350 482 M350 482 Q330 505 303 488 M350 482 Q370 505 397 488" fill="none" stroke="#7c2d12" stroke-width="6" stroke-linecap="round"/>
  <!-- whiskers -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <line x1="255" y1="470" x2="150" y2="450"/>
    <line x1="255" y1="485" x2="150" y2="495"/>
    <line x1="445" y1="470" x2="550" y2="450"/>
    <line x1="445" y1="485" x2="550" y2="495"/>
  </g>
</svg>
